version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: elf_automation
      POSTGRES_USER: elf_user
      POSTGRES_PASSWORD: elf_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/shared/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - elf_network

  # Authentication Service
  auth-service:
    build:
      context: ../backend/auth-service
      dockerfile: Dockerfile
    ports:
      - "5003:5000"
    environment:
      - DATABASE_URL=postgresql://elf_user:elf_password@postgres:5432/elf_automation
      - SECRET_KEY=your-secret-key-change-in-production
    depends_on:
      - postgres
    networks:
      - elf_network

  # Case Service
  case-service:
    build:
      context: ../backend/case-service
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://elf_user:elf_password@postgres:5432/elf_automation
    depends_on:
      - postgres
    networks:
      - elf_network

  # AI Service
  ai-service:
    build:
      context: ../backend/ai-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://elf_user:elf_password@postgres:5432/elf_automation
    depends_on:
      - postgres
    networks:
      - elf_network

  # Attorney Service
  attorney-service:
    build:
      context: ../backend/attorney-service
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - DATABASE_URL=postgresql://elf_user:elf_password@postgres:5432/elf_automation
    depends_on:
      - postgres
    networks:
      - elf_network

  # Frontend Web App
  frontend-web:
    build:
      context: ../frontend/web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_AUTH_SERVICE_URL=http://localhost:5003
      - VITE_CASE_SERVICE_URL=http://localhost:4000
      - VITE_AI_SERVICE_URL=http://localhost:5001
      - VITE_ATTORNEY_SERVICE_URL=http://localhost:5002
    depends_on:
      - auth-service
      - case-service
      - ai-service
      - attorney-service
    networks:
      - elf_network

volumes:
  postgres_data:

networks:
  elf_network:
    driver: bridge 